[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imoviehd2fcp"
version = "1.1.0b1"
description = "Migrate legacy iMovie HD projects into modern Final Cut Pro"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "iMovieHD2FCP contributors"}
]
keywords = ["iMovie HD", "Final Cut Pro", "FCPXML", "video", "archive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8"]

[project.scripts]
imoviehd2fcp = "imoviehd2fcp.cli:main"
imoviehd2fcp-app = "imoviehd2fcp.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
